<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>CARERA — объявления</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <a href="/index.html">CARERA</a>
      </div>

      <div class="nav">
        <a href="/index.html" data-nav="home">Главная</a>
        <a href="/ads.html" data-nav="ads">Автомобили</a>
        <a href="/import-order.html" data-nav="import">Заказ из-за границы</a>
        <a href="/import-orders.html" data-nav="orders">Заявки</a>
        <a href="/admin.html" data-nav="admin" id="adminNavLink" style="display:none;">Админка</a>
      </div>

      <div class="topbar-right">
        <button class="btn-circle" id="headerLoginBtn">Вход</button>
        <button class="btn-circle" id="headerProfileBtn" style="display:none;"></button>
        <button class="btn-circle" id="headerLogoutBtn" style="display:none;">Выйти</button>
      </div>
    </div>
  </div>

  <div class="page-root">
    <div class="wrapper">
      <div class="page-header">
        <h2 class="page-title">Объявления о продаже автомобилей</h2>
        <p class="page-subtitle">Выберите подходящую машину по параметрам</p>
      </div>

      <div class="layout ads-layout">

        <div class="ads-toolbar">
          <button id="filtersToggle" class="btn btn-primary filters-toggle" type="button">
            Показать фильтры
          </button>

          <input
            id="adsSearchInput"
            class="input ads-search-input"
            type="search"
            placeholder="Марка, модель, год, описание"
          />
        </div>

        <aside class="filters" id="filtersPanel">
          <h3>Фильтры</h3>

          <div class="form-group">
            <label class="label" for="makeSelect">Марка</label>
            <select id="makeSelect" class="select"></select>
          </div>

          <div class="form-group">
            <label class="label" for="modelSelect">Модель</label>
            <select id="modelSelect" class="select"></select>
          </div>

          <div class="form-group">
            <label class="label" for="bodyTypeSelect">Тип кузова</label>
            <select id="bodyTypeSelect" class="select"></select>
          </div>

          <div class="form-group">
            <label class="label">Год выпуска</label>
            <input id="yearFrom" class="input" placeholder="от" />
            <input id="yearTo" class="input" placeholder="до" />
          </div>

          <div class="form-group">
            <label class="label">Цена</label>
            <input id="priceFrom" class="input" placeholder="от" />
            <input id="priceTo" class="input" placeholder="до" />
          </div>

          <div class="form-group">
            <button id="applyFilters" class="btn btn-primary" type="button">
              Применить
            </button>
          </div>

          <div class="form-group">
            <button id="resetFilters" class="btn btn-ghost" type="button">
              Сбросить
            </button>
          </div>
        </aside>

        <main class="content">
          <div id="adsCounter">Загрузка объявлений...</div>
          <div id="adsList"></div>
        </main>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
