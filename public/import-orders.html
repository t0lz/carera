<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>CARERA — заявки на импорт</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <a href="/index.html">CARERA</a>
      </div>
      <div class="nav">
        <a href="/index.html" data-nav="home">Главная</a>
        <a href="/ads.html" data-nav="ads">Автомобили</a>
        <a href="/import-order.html" data-nav="import">Заказ из-за границы</a>
        <a href="/import-orders.html" data-nav="orders">Заявки</a>
        <a href="/admin.html" data-nav="admin" id="adminNavLink" style="display:none;">Админка</a>
      </div>
      <div class="topbar-right">
        <button class="btn-circle" id="headerLoginBtn">Вход</button>
        <button class="btn-circle" id="headerProfileBtn" style="display:none;"></button>
        <button class="btn-circle" id="headerLogoutBtn" style="display:none;">Выйти</button>
      </div>
    </div>
  </div>

  <div class="wrapper">
    <div class="page-header">
      <h1 class="page-title" id="ordersTitle">Заявки на импорт</h1>
      <p class="page-subtitle" id="ordersSubtitle">История заказов автомобилей из-за границы и их текущие статусы.</p>
    </div>

    <div class="profile-card">
      <table class="table orders-table">
        <thead>
          <tr>
            <th>Номер</th>
            <th>Автомобиль</th>
            <th>Клиент</th>
            <th>Итог</th>
            <th>Статус</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="importOrdersBody">
          <tr><td colspan="6">Загрузка заявок...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/import-orders.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
