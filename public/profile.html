<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>CARERA — профиль</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <a href="/index.html">CARERA</a>
      </div>
      <div class="nav">
        <a href="/index.html" data-nav="home">Главная</a>
        <a href="/ads.html" data-nav="ads">Автомобили</a>
        <a href="/import-order.html" data-nav="import">Заказ из-за границы</a>
        <a href="/import-orders.html" data-nav="orders">Заявки</a>
        <a href="/admin.html" data-nav="admin" id="adminNavLink" style="display:none;">Админка</a>
      </div>
      <div class="topbar-right">
        <button class="btn-circle" id="headerLoginBtn">Вход</button>
        <button class="btn-circle" id="headerProfileBtn" style="display:none;"></button>
        <button class="btn-circle" id="headerLogoutBtn" style="display:none;">Выйти</button>
      </div>
    </div>
  </div>

  <main class="wrapper profile-page">
    <div class="page-header">
      <h1 class="page-title">Мой профиль</h1>
      <p class="page-subtitle">Личные данные, объявления и быстрые действия.</p>
    </div>

    <div class="profile-layout">
      <aside class="profile-left">
        <section class="profile-card profile-summary" id="profileInfo">
          Загрузка профиля...
        </section>
      </aside>

      <section class="profile-right">
        <div class="profile-card profile-edit-card">
          <div class="section-head">
            <div>
              <h2>Редактирование профиля</h2>
              <p>Эти данные отображаются в объявлениях и заявках.</p>
            </div>
          </div>
          <form id="profileForm" class="profile-form">
            <div class="form-group">
              <label class="label" for="profileEmail">Email</label>
              <input class="input" id="profileEmail" type="email" required>
            </div>
            <div class="form-group">
              <label class="label" for="profilePhone">Телефон</label>
              <input class="input" id="profilePhone" placeholder="+7...">
            </div>
            <div class="form-group">
              <label class="label" for="profileFirstname">Имя</label>
              <input class="input" id="profileFirstname">
            </div>
            <div class="form-group">
              <label class="label" for="profileLastname">Фамилия</label>
              <input class="input" id="profileLastname">
            </div>
            <button class="btn btn-primary" type="submit">Сохранить</button>
          </form>
        </div>

        <div class="profile-card">
          <div class="section-head">
            <div>
              <h2>Мои объявления</h2>
              <p>Созданные вами объявления и управление ими.</p>
            </div>
            <a class="btn btn-light btn-sm" href="/new-ad.html">Добавить</a>
          </div>
          <div id="myAdsList"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
