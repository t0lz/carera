<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>CARERA — новое объявление</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <a href="/index.html">CARERA</a>
      </div>
      <div class="nav">
        <a href="/index.html" data-nav="home">Главная</a>
        <a href="/ads.html" data-nav="ads">Автомобили</a>
        <a href="/import-order.html" data-nav="import">Заказ из-за границы</a>
        <a href="/import-orders.html" data-nav="orders">Заявки</a>
        <a href="/admin.html" data-nav="admin" id="adminNavLink" style="display:none;">Админка</a>
      </div>
      <div class="topbar-right">
        <button class="btn-circle" id="headerLoginBtn">Вход</button>
        <button class="btn-circle" id="headerProfileBtn" style="display:none;"></button>
        <button class="btn-circle" id="headerLogoutBtn" style="display:none;">Выйти</button>
      </div>
    </div>
  </div>

  <div class="wrapper form-page">
    <div class="form-card">
      <div class="form-title">Новое объявление</div>
      <div class="form-subtitle">Заполни данные автомобиля, добавь фото и укажи цену</div>

      <form id="adForm">
        <div class="form-group">
          <label class="label" for="makeInput">Марка</label>
          <input id="makeInput" class="input" type="text" placeholder="Например, Hyundai" />
        </div>

        <div class="form-group">
          <label class="label" for="modelInput">Модель</label>
          <input id="modelInput" class="input" type="text" placeholder="Например, Tucson" />
        </div>

        <div class="form-group">
          <label class="label" for="bodyTypeSelect">Тип кузова</label>
          <select id="bodyTypeSelect" class="select"></select>
        </div>

        <div class="form-group">
          <label class="label" for="year">Год выпуска</label>
          <input id="year" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="mileage">Пробег (км)</label>
          <input id="mileage" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="color">Цвет</label>
          <input id="color" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="transmission">Коробка передач</label>
          <input id="transmission" class="input" placeholder="автомат / механика" />
        </div>

        <div class="form-group">
          <label class="label" for="fuelType">Тип топлива</label>
          <input id="fuelType" class="input" placeholder="бензин / дизель / газ" />
        </div>

        <div class="form-group">
          <label class="label" for="driveType">Привод</label>
          <input id="driveType" class="input" placeholder="передний / задний / полный" />
        </div>

        <div class="form-group">
          <label class="label" for="engineVolume">Объём двигателя (л)</label>
          <input id="engineVolume" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="powerHp">Мощность (л.с.)</label>
          <input id="powerHp" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="torqueNm">Крутящий момент (н·м)</label>
          <input id="torqueNm" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="title">Заголовок объявления</label>
          <input id="title" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="description">Описание</label>
          <textarea id="description" class="textarea"></textarea>
        </div>

        <div class="form-group">
          <label class="label" for="price">Цена (₽)</label>
          <input id="price" class="input" />
        </div>

        <div class="form-group">
          <label class="label" for="adPhotos">Фотографии автомобиля</label>
          <input
            id="adPhotos"
            class="input"
            type="file"
            accept="image/*"
            multiple
          />
          <div class="small">Можно выбрать до 10 фото. Максимальный размер одного файла — 5 МБ.</div>
          <div id="selectedPhotosPreview" class="photos-preview"></div>
          <div id="existingPhotosPreview" class="photos-preview"></div>
        </div>

        <div class="form-group">
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/ad-form.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
